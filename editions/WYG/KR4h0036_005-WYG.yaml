body:
  text: 嚴陵集巻五宋董弅編詩經嚴子陵釣臺作四首龐籍翠岫臨寒瀬先生老此中釣耕輕萬乘要領戒三公入宿星躔動歸來世網空何人知此意千古激澆風道閉寧濡足時平亦括囊故人登帝世清瀬自吾鄉渭叟非真釣商奴是詐狂先生不可問天外一鸞翔聞箇狂奴足生平在草萊不榮升帝腹寧自蹋魚臺歩武中朝下胼胝故國回滄浪重一濯京雒有塵埃長天杳杳道𠖇𠖇一士孤風逹至精雲若有心應有著魚縁輕餌是輕生何人楚澤三年放此地家灘七里清應宿將臣皆列土未將煙水博功名釣臺王安石漢庭來見一羊裘閔黙還歸舊釣舟迹似磻溪應有待世無西伯豈能留﨑嶇馮衍才終廢寂寞桓譚道被尤回視蒼生終不遇脫身江海更何求詠嚴子陵梅堯臣不顧萬乘主不屈千户侯手登百金魚身披一羊裘借問此何爾心逺忘九州青山束寒灘濺浪驚素鷗以之為朋親安慕乗華輈老氏輕璧馬莊生惡犧牛終為藴玉石夐古輝巖丘讀范桐廬述嚴先生祠堂碑二蛇志不同相得蓁莾裏一蛇化為龍一蛇化為雉龍飛上亨衢雉飛入深水為蜃得自宜潜游江海涘變化雖覺殊有道固終始光武與嚴陵其義亦云耳所遇在草昧既貴不為起翻然歸富春曽不相助治至今存清芬烜赫燿圖史人傳七里灘昔日來釣此灘上水濺濺灘下石齒齒其人不可見其事清且美有客乗朱輪裵􅏆想前軌著詞刻之碑復俾存厥祀欲以廉貪夫又以立懦士千載名不忘休哉古君子送正仲都官知睦州每嗟相逢少常苦離别多行行復止止往往起悲歌古來易水上義士有荆軻捐軀思報恩飲恨歌柰何況彼兒女懷牽纒如蔓蘿是以世間人鬢髪易番番喜君得郡章東歸隨春波灘上嚴子祠繫船聊經過其人當漢興富貴不可羅足加天子腹傲去釣于河冬披破羊裘夏披破草蓑心中小宇宙尤哂獻玉和我慙賤丈夫豈異帶面儺未免為鬼笑誰知懼撝訶安得如君行收迹已蹉跎空將閒歲月塵埃浪消磨正同三峽賈盡力向盤渦送余少卿知睦州青山峽裏桐廬郡七里灘頭太守船雲霧未開藏宿鳥坡原將近見燒田養茶摘蘂新春後種橘收包小雪前民事蕭條官政簡家書時問霅溪邊送江學士通判睦州渉淮淮水淺泝溪溪水遲君到桐廬日正值采茶時試問嚴陵跡今復有誰知送崔主簿赴睦州清溪舟輕不畏險逆上子陵灘七里峽天翠千重雲木寒古祠鳴野鳥亂石激春湍正與髙懐愜寧歌行路難寄建德徐元輿才子方為邑千峯對縣門静便琴意古門厭鳥聲喧山茗烹仍緑池蓮摘更繁訟稀應詠物庭下長蘭蓀送陳生還烏龍山舊居蘇舜欽百丈清溪見戲鱗嚴公祠宇與天鄰此中舊隱君歸去笑指人寰一片塵題子陵釣臺二首孫沔舊交為帝不能邀百尺雙臺照暮濤逸迹已將山共永清名仍與月爭髙魯連解難終辭禄龍伯持傾只釣鼇列傳古碑言未盡一灘風竹自蕭騷中興曽作故人看抗節唯憐七里灘枯枿卧沙疑野艇叢篁生岸憶長竿天邊舊跡星辰動江上餘基水石寒應笑渭濵周吕望白頭因獵從和鑾子陵釣臺王存嚴公英魄去何之江上空餘舊釣磯古木蒼煙鸜鵒噪清波白石鷺鷥飛山中秋色香秔熟壠下朝寒赤鯉肥何事夷齊恥周粟一生顦顇首陽薇題釣臺馮京渭水塵空紺業傾桐江煙老漢風明蚤知賢逹窮通意閒把漁竿只釣名釣臺沈括漁釣非良業相期遯姓名太平雖不仕故舊豈無情七里林泉好三公位貌輕片颿湍石下誰不仰先生睦州秀亭錢勰秀色四時好探春來此亭花初擁檻發山晚與雲青得鱠嚴陵瀬評泉陸羽經歡餘不盡醉鼓角限重扃甘棠樓樓曲開三面山重合四圍溪衝朝靄出颿竝夕陽飛芳杜供春望晴雲渡袷衣樊川猶未識清興暮忘歸小杜睦州詩為多未有此也髙峯寺苒苒郡城東穿雲入幾重已窮難上路才到最髙峯竹老龍孫瘦泉甘馬酒濃何當來潄石安隱飽疎慵漢大官有挏馬酒東館樓前太守丁公善郎中命予名之按孫權赤烏中使賀齊討黟歙為新定入晉為遂安郡今此地也㑹公善去郡未掲也宜曰分歙樓簾影隔朝暾雲低晝尚昏山形分歙翠溪色到江渾日盡天垂幕歌餘酒滿尊欄干不堪倚歸思斷鄉魂玉泉菴遥派落天潢分崖射壁光山從千古潤江得一源長風雨無時作珠璣滿谷量淄澠欲誰辯願借易牙嘗勉郡庠諸生趙抃桐江為守媿顓蒙來喜衣冠好士風勸學重思唐吏部教人多謝蜀文翁濟時事業期深得落筆詞章貴不空道有未充湏自力莫將榮顇汨於中玉泉亭潺潺朝暮入神清落澗通池遶郡㕔亂石長松山十里討源須上玉泉亭題髙峯上石扳松干歩勞下窺人物過秋毫嗟誰更向中峯頂樹塔孤撐碧落髙題甘棠樓闌干十二壓仙瀛占得龍峯作畫屏林映逺籠千里月湖光寒照一天星望來瀑布真霜練飛過沙禽半雪翎人賞不知春已老隔橋依舊柳青青子陵釣臺楊傑髙風誰得似先生七里溪山當畫屏功業不隨東漢祖光芒獨應少㣲星蘭臺有史傳名姓蓬户無人問醉醒若使當時忘故態何由千古羡鴻𠖇方干故居千載富春渚先生家獨存𤣥英播寰宇丹桂付兒孫文正重髙節子陵同享尊泊舟明月夜重為弔吟魂方氏清芬閣刁約自别髙居二紀餘今朝重到懶踟蹰山川勝景依然在屈指交親一半無嚴陵山一染浮名十五春强隨時態役天真何年卜築兹山下卻笑區區世路人廵按睦州過烏龍山元絳羣山衮衮巻波濤舉手天門尺五髙塵土多年昏病眼猶能千里見秋毫桐廬晚景向晚西風急扁舟下瀬輕颿檣掛山影鼔吹壓潮聲白鳥煙中没斜陽雨外明油然五湖意渾欲薄功名宿清溪安樂山張景修映忩猶剰雪餘痕瓶裏梅花枕上聞一椀鐙寒聽夜雨半牀氊煗卧春雲詩成始覺茶銷睡香盡翻嫌酒帶醺我是掛冠林下客山中安樂合平分過桐廬邑二首隱君無姓字何代至今存數里山為宅兩株桐是孫人煙半峯碧溪水帶潮渾多少來游客茫茫蹋藥根三載江南客還呉東復西潮吞兩溪盡雲截衆山齊舟楫無空日樓臺半上梯桐廬隱君子應笑只留題釣臺羊裘東漢客歸隱釣魚灘天子不能屈先生非苟難雲藏古石在風激世人寒祠下靑靑竹何妨把釣竿清芬閣嚴子釣臺畔猶聞吟嘯聲榮華付諸弟瀟灑繼先生自製茶槍嫩新開酒面清紅塵不抛擺那得白雲名再至新定有感岑象求蜀地呉天各一涯去來三紀亦云賖烏龍遶郭儼如舊白髮滿頭良可嗟老矣不堪多感慨使乎何處是光華周行歴覽猶疑夢更問庭櫧幾度花詠縣㕔前古櫧木三十年前宰一同朝朝相對此庭中如今翠葉樛枝好依舊朱欄戒石東潘岳河陽花立盡陶潛彭澤柳隨空唯君獨負堅剛操何異靈椿與夏蟲方氏故居邵亢偶分魚竹到稽山處士林泉一望間歲月自隨流水逺姓名長與白雲閒鑑中人去荒遺迹處士鑑湖有别業今不知其處矣溪口僧來寫舊顔處士祠堂真像即㑹稽溪口僧恱躬筆何日放船訪巖藪吾門髙第約躋攀處士逺孫蒙即僕同知貢舉日敕放進士也題釣臺馬存子陵臺下山層層竒峯壯氣横雲生處士溪邊水泚泚碧波明月涵天清老松偃蹇傲世色緑竹瀟灑吟風聲潮頭百仞出海門飄呉擊越如毛輕飛來灘下不敢過變作平浪歸滄溟清溪行陳軒山色碧於溪扁舟泛落暉水煙颿界破沙鷺槳驚飛島嶼隨流曲漁鐙隔岸㣲月明何處宿待訪子陵磯憶清溪縣昔愛清溪景人煙百里間湖居皆釣客郭外盡禪關酒市揺青斾公街枕碧山枉教成久别無計約追還泛清溪曉煙如練曳平津一櫂東風兩岸春島鷺沙鷗休戀我北堂歸有白頭親憶雉山書齋松隂江曲舊齋堂别業歸來各一方吟想晚潮煙柳濕夢游春檻露花涼楊朱路逺空南北青帝亭閒自短長何日揚鞭訪前景竹窓重整讀書牀桐江夕下浪催鳴艣去嘔啞古岸蕭蕭感歲華雨脚蒼茫驚斷鴈煙痕濛宻濕棲鴉蘆花正落汀飛雪楓葉初丹岸有霞漸覺望中山色暝數星鐙火認漁家釣臺呉可幾君王取天下有人將甲兵君王得天下有人相昇平我欲介其間區區安取成莫若歸養髙髙卧嵓之扃直使萬乘意慕仰飛鴻𠖇身雖隱漁釣心豈忘朝廷常慮天下定君王志驕盈羣臣習見聞力諌不爾聽不有不臣者不足回其清商山四老人用是安西京潛希絶世躅萬一助聖明年當建武日上下咸清寧所懐意不陳終焉為客星如何逸民傳乃有狂奴名過子陵釣臺葉棐恭勢利輕捐寄傲中毅然髙節凛秋風耕閒釣寂千年迹立懦廉貪萬世功須信林間無怨鶴更知天外有𠖇鴻扁舟夜泊靈祠下慨慕先生道不窮留題釣臺劉涇水緑山青人可知不知生氣得之誰釣竿已屬嚴公手直到𤣥英解道詩釣臺賈青萬疊層峯夾兩溪雨餘清氣却炎暉何時學得嚴陵傲洗盡塵襟卧釣磯釣臺王逵一句能通萬世情若非髙位即嘉聲如何自古留題者不悟嚴光解釣名釣臺張綬范蠡功成始遁逃淵明五斗便辭勞先生二事俱無一名與青山萬古髙釣臺余闢不誇長揖出宫闈不重為漁老釣磯最愛清宵銀漢上客星時共帝星輝嚴陵集巻五
