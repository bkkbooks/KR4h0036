body:
  text: 嚴陵集卷二宋董弅編詩桐廬山中贈李明府孟郊靜境無濁氛清雨零碧雲千山不隱響一葉動亦聞即此佳志士精微誰相羣欲識楚一作此章句袖中蘭茝薰題嚴光釣臺歐陽詹弭棹歷陳迹悄然關我情伊無昔時節豈有今時名辭貴不辭賤是心誰復行欽哉此溪曲永獨英風清送友人喻坦之歸睦州韓翃歸心常共知歸路不相隨彼此無依倚東西又别離山花含雨潤江樹逆潮欹莫想漁樵興人生各有為送徐山人歸睦州舊隱雍陶君在桐廬何處住草堂應與戴家鄰初歸山犬翻驚主久别江鷗卻避人終日欲為相逐計臨時空羡獨行身秋風釣艇遙相憶七里灘西片月新嚴子陵唐彥謙嚴陵情性是真狂抵觸三公傲帝王不怕舊交嗔僭越喚他侯霸作君房送劉崇偃尉睦州建德縣張祜一命前途逺雙曹公邑間夜潮人到郭春霧鳥啼山淺瀨橫沙堰髙巖峻石斑不堪曽倚棹猶復夢升攀晚泊七里灘許渾天晚日沈沈歸船繫栁隂江村平見寺山郭逺聞砧樹密猿聲響波澄鴈影深榮名暫時事誰識子陵心思桐廬舊居便送鑑上人溫庭筠莫道東南路不賒思歸一步是天涯林中夜半雙臺月嚴光釣渚有東臺西臺洲上春深九里花桐廬有九里洲緑樹繞村含細雨寒潮背郭卷平沙聞師卻到鄉中去為我殷勤謝酒家春日旅舍言懷李頻未識東西南北路青春日月坐銷難如何一别故鄉後五度花開五處看及第後歸新定家臨浙水傍岸對買臣鄉縱棹隨歸鳥乘潮向夕陽苦吟身得雪甘意鬢成霜况此年猶少酬身足自強春日思歸春晴不斷若連環一夕思歸鬢欲斑壯志未酬三尺劒故鄉空隔萬重山音書斷絶干戈後親友相逢夢寢間卻羡浮雲與飛鳥因風吹去又吹還還夀昌過西嶺下贈婦魏馱家前幾樹花嶺西還有數千家石斑魚鮓香衝鼻淺水沙田飯繞牙自黔中歸新定朝過春關辭北闕暮參戎幕向南巴卻將仙桂東歸去江月隨人直到家貽友人喻坦之從容心自别飲水勝銜杯共在山中長相隨闕下來修身空有道取事各無媒不信清平代終遺草澤才白雲亭羅萬象一池荷葉衣無盡數樹松花食有餘剛被世人知住處不如依舊再移居寄李頻方干衆木又搖落望君還不還軒車在何處雨雪滿前山思苦文星動鄉遙釣渚間明年見名姓唯我獨何顔途中逢孫輅因得李頻消息灞上寒仍在柔條亦自新山河雖度臘雨雪未知春正憶同袍者堪逢共國人銜杯益無語與爾轉相親題桐廬謝逸人江居少小髙眠無一字五侯勳盛欲如何潮邊倚竹寒吟苦石上橫琴夜醉多鳥自樹梢隨果落人從窗外卸帆過由來朝市為真隱可要棲身向薜蘿睦州吕郎中郡中環翠亭為是仙才登望處風光便似武陵春間花半落猶迷蝶白鳥雙飛不避人樹影興餘侵枕簟荷香坐久著衣巾暫來此地非多日明主那容借冦恂與鄉人鑑休上人别此日因師話鄉里故鄉風土我偏諳一巵竹葉如溪北半樹梅花似嶺南山夜獵徒多信犬雨天村舍未催蠶如今休作還家意兩鬢垂絲已不堪方著作畫竹疊葉與髙節俱從毫末生留傳千古譽研鍊十年情向月本無影臨風疑有聲吾家釣臺畔似此兩三莖暮發七里灘夜泊嚴光臺下一瞬即七里箭馳猶是難檣邊走嵐翠枕底失風湍但訝猿鳥定不知霜月寒前賢竟何益此地誤垂竿山中散拙亦自遂粗將猿鳥同飛泉髙瀉月獨樹逈含風果落槃盂上雲生篋笥中未甘明聖日終作釣魚翁與清溪趙明府清規暫趨府獨立與誰親遂性無非醉求間卻愛貧林泉應入夢印綬莫留人王事聞多暇吟求幾首新示鄉叟暮齒甘衰謝逢人惜别離青山前代業老樹此身移買藥將衣盡尋方見字遲如何鑷殘鬢覽鏡變成絲題烏龍山禪居暑夜月華猶冷濕自知坐卧逼星宫晨雞未暇鳴山底蚤日先來照屋東人世驅馳方丈內海波搖動一杯中伴師長住應難住歸去仍須入俗籠題睦州郡中千峯榭豈知平地似天台朱户深沈别徑開曳響露蟬穿樹去斜行沙鳥向池來窗中蚤月當琴榻牆上秋山入酒杯何事此中如世外應緣羊祜是仙才德政上睦州胡中丞上德由來合動天旌旗到日是豐年羣書已熟無人似五字研成舉世傳莫道政聲同宇宙須知紫氣滿山川豈唯里巷皆蘇息猶有恩波及釣船與桐廬鄭明府字人心苦達神明何止重門夜不扄莫道耕田全種秫兼聞退食亦逢星映林顧兔停琴望隔水寒猿駐筆聽卻恐南山盡無石南山有石合為銘胡中丞蚤梅不獨間花不共時一株寒艷尚參差凌晨未噴含霜朵應候先開亞水枝芬郁合將蘭並茂凝明應與雪相欺謝公吟賞愁飄落可得更拈長笛吹山中寄吳磻莫問終休否林中事已成槃餐憐火種嵗計付刀耕掬水皆花氣聽松似雨聲書窗翹足卧避險側身行果傍間軒落蒲連濕岸生禪僧知見理妻子笑無名更擬教詩苦何曽待酒清石溪魚不大月樹鵲多驚砌下通樵路窗間見縣城雲山任重疊難隔故交情憶故山舊山長繫念終日卧邊亭道路知已逺夢魂空再經秋泉涼好引亂鶴靜宜聽獨上髙樓望蓬身且未寧送王翁登科後歸江東南行無俗侣秋鴈與寒雲野性自心愜鄉名人共聞吳山中路斷浙水半江分此地登臨慣含情一送君山中即事趨世非身事山中適性情野花多異色幽鳥少凡聲樹影搜涼卧苔光破碧行間尋采藥處仙路漸分明陪睦州胡中丞泛江仙舟仙樂醉行春上界稀逢下界人綺繡峯前聞野鶴旌旗影裏見遊鱗澄潭徹底齊心鏡雜樹含芳讓錦茵凡許從容誰不幸就中光顯是州民初歸故里常思舊里欲歸難已作歸心即自寬此日蚤知無爵位當時便合把漁竿朝昏入閏春將逼城邑多山夏卻寒不是幽愚望榮忝君侯異禮亦何安歸睦州中路寄侯郎中顔巷蕭條知命後膺門感激受恩初卻容鶴髮還蝸舍猶夢漁竿從隼旟新定暮雲吞故國會稽春草入貧居鄉中自古為儒者誰得公侯降尺書侯郎中新置西湖逺近利民因智力周回潤物像心源菰蒲縱感生成惠鱣鮪那知廣大恩瀲灔清輝吞半郭縈紆别派入遙村沙泉繞石通山脈岸木黏萍是浪痕已見澄來連鏡底兼知極處浸雲根波濤不起時方泰舟楫徐行日易昏煙霧未應藏島嶼鳬鷖亦解避旌幡雖云桃葉歌還醉卻被荷花笑不言孤鶴必應思鳳詔凡魚豈合在龍門能將盛事添元化一夕機謨萬古存嵗晚言事寄鄉中親友急景蒼茫晝若昏夜風乾峭觸前軒寒威半入龍蛇窟暖氣全歸草樹根蠟燼凝來多碧焰香醪滴處有冰痕尺書未達年應老先被新春入故園項處士畫水墨釣臺畫石畫松無兩般猶嫌瀑布畫聲難雖云智慧生靈府要且功夫在筆端潑處便連隂洞黑添來先向朽枝乾我家曽寄雙臺下往往開圖盡日看送睦州侯郎中赴闕昔著政聲聞國外今留儒術化江東青雲舊路歸仙掖白鳳新詞入聖聰絃管未知銀燭曉旗幡已待錦帆風郡人難議酬恩德遍在三年禮遇中桐廬江閣風煙百變無定態緬想畫人虛損心卷箔檻前沙鳥散垂鈎牀下錦鱗沈白雲野寺凌晨磬紅樹孤村遙夜砧此地四時拋不得非惟盛暑事開襟偶作直為篇章非動衆遂令軒蓋不經過未妨溪上泛漁艇又得門前張雀羅夜學事須憑雪照朝厨爭奈絶煙何若於巖洞求偏類今古疏愚似我多送鄉中故人少小與君情不疏聽君細話勝家書如今若到鄉中去道我垂鈎不釣魚思江南昨日草枯今日青羈人又動望鄉情夜來有夢登歸路不到桐廬已及明懷桐江舊居長向新郊話故園四時清峭似山源春潮撼動鶯花郭秋雨閉藏砧杵村市井多通諸國貨鄉音自是一方言此中别有無歸計唯把歸心付酒尊贈桐溪主人嶺猿沙鶴似同遊竹汊荷灣可漾舟更入深溪見溪主蒼苔石上卧垂鈎題懸溜巖隱者居世人如要問生涯滿架堆牀是五車谷鳥暮蟬聲四散修篁灌木勢交加蒲葵細織團圓扇薤菜平鋪合遝花卻用水荷包緑李兼將寒井浸甘瓜慣緣險峭收松粉常趁芳鮮掇茗芽池上樹隂隨浪動窗前月影被巢遮坐雲獨酌杯盤濕穿竹微吟路徑斜見説公卿訪遺逸逢迎亦是戴烏紗題仙巖瀑布呈陳明甫方知激蹙與飛噴直恐古今同一時逺壑流來多石脈寒空撲碎作凌澌謝公巖上衝雲去織女星邊落地遲聚向山前更誰測深沈見底是澄漪書桃花塢周處士壁醉吟雪月思深苦思苦神勞新髮生自學古賢修靜節唯應野鶴識髙情細泉出石飛難盡孤燭和雲濕不明何事懶於嵇叔夜更無書札答公卿法華寺砌下雙顚有鶴棲孤猿亦在鶴邊啼卧聞雷雨歸巖蚤坐見星辰去地低一徑穿緣應就郭千花掩映似無溪是非生死多憂惱此日蒙師為破迷贈方干吳融把筆盡為詩何人敵夫子句滿天下口名聒天下耳不識朝不識市曠消搖間徙倚一杯酒無萬事一葉舟無千里衣裳白雲坐卧流水霜落風髙忽相憶惠然見過留一夕一夕聽吟十數篇水榭林蘿為岑寂拂旦舍我亦不辭攜笻徑去隨所適隨所適無處覔雲半片鶴一隻清溪清溪見底露蒼苔密竹垂藤鎖不開應是仙家在深處愛流花片引人來贈方干可鵬盛名傳出自皇州一舉參差便縮頭月裏不無攀桂分潮中剛愛釣魚休童偷詩稿呈鄰叟客乞書題謁郡侯獨泛短舟無限興波濤西接洞庭秋哭方先生斗牛文星落知是先生死湖上聞哭聲門前見彈指官無一寸祿名傳千萬里死著紙衣裳生誰念朱紫我心痛其語淚落不能已猶喜韋補闕揚名獻天子歸桐廬寄嚴長史章八元昨辭夫子棹歸舟家在桐廬憶舊丘三徑暖時花競發兩溪分處水爭流近聞江老傳鄉語還見家山減旅愁或在醉中逢雪夜懷賢應向剡川遊釣臺劉駕澄流可濯纓嚴子但垂綸孤坐九層石逺笑清渭濱潛龍飛上天四海豈無雲清氣不零雨安使洗塵氛我來吟髙風倣佛見斯人江月尚皎皎江石亦磷磷如何臺下路明日又迷津送尹蔓回睦州厲翼憐君授衣月逺作泛舟行江闊桐廬岸山深建德城千尋喬木影七里暮灘聲興盡當停棹臨流更濯纓釣臺唐穎寥落荒臺七里洲賢人永逐水東流寒猿呌斷青天月千古冥冥潭樹秋釣臺杜荀鶴蒼翠雲峯開俗眼泓澄煙水浸塵心唯將道業為芳餌釣得髙名直至今清溪來明府出二子請詩因遺一絶珠明玉潤盡驚人不稱寒門不稱貧若向吾唐作雙瑞便同祥鳳與祥麟哭方干何言寸祿不沾身身沒詩名萬古存况有數篇關教化得無餘慶及兒孫漁樵共壘墳三尺猿鶴同棲月一村天下未寧吾道喪更誰將酒酹吟魂桐江春望劉仁德江上車聲落日催紛紛擾擾起塵埃更無人望青山立空有帆衝夜色來沙鳥似雲鐘外去汀花如火雨中開可憐瀟灑鴟夷子散髮扁舟竟不回聞進士許彬罷舉歸睦州悵然懷寄鄭谷桐廬歸舊廬垂老復樵漁吾子雖言命鄉人懶讀書煙舟撑晚瀨雨屐剪春蔬異代名方振哀吟莫廢初題清溪方仙翁廟髙駢清溪道士人不識上天下天鶴一隻洞房深鎖壁窗寒滴露研朱點周易引泉詩睦州龍興觀老君院作陸龜蒙上嗣位六載吾宗刺桐川余來拜旌戟詔下之明年是時春三月繞郭花蟬聮嵐盤百萬髻上插黃金鈿授以道士館置榻于東偏滿院聲碧樹空堂形老仙本性樂凝淡及來更虛玄焚香禮真像盥手披靈編新定山角角烏龍獨巉然除非淨晴日不見蒼崖顛上有拏雲峰下有噴壑泉泉分數十義落處皆清潺寒聲入爛醉聒破西窗眠支笻起獨尋只在牆東邊呼僮具畚鍤立鑿莓苔穿漾叢漴派墮練帶橫斜牽亂石拋落落寒流響濺濺狂奴七里瀨縮到疏楹前跳光潑半散涌沫飛漩圓勢束三峽挂瀉危孤磴縣曽聞瑶池溜亦灌朱草田鳬伯弄翠繠鸞雛舞丹煙凌風捩桂柁隔霧馳犀船况當玄元家嘗著道德篇上善可比水斯文參五千精靈若在此前惡微波傳不擬爭滴瀝還應會淪漣出門後飛箭合勢浮青天必有學真子鹿冠秋鶴顔如能輔余志日使疏其源上新定宋使君二首貫休禪坐吟行誰與同杉松共在寂寥中碧雲詩理終難到白藕花經講始終水疊山重擎草疏砧清月皓立霜風十年勤苦今酬了得向桐江識謝公寺倚烏龍腹窗中見碧稜空廊人畫祖古殿鶴窺鐙風吼深松雪爐寒一鼎冰唯應謝內史知此道心澄寄桐江馮使君四首山風與霜氣浩浩滿松枝永日燒杉子無人共此時為文攀諷諫得道在毫釐唯有桐江守常憐志不卑端居碧雲暮好鳥啼紅芳滿郭桃李熟卷簾風雨香清吟繡段句默念芙蓉章未得歸山去頻升謝守堂山東山色勝諸山謝守清髙不可攀薄俗盡於言下泰苦心唯到醉中間香凝錦帳抄書後月轉棠隂送客還野客霑恩歸未得蕭蕭霜葉滿柴關瓦礫文章豈有媒兩三年只在金臺本師頭白須歸去太守門清願再來皓皓玉霜孤鴈逺蕭蕭松島片帆開從兹林下終無事唯有焚香祝上台秋寄李頻使君二首為郎須塞詔當路亦飢驅貴不因人得清還似句無燒煙連野白山藥拶階枯想得徴黃詔如今已在途務簡趣難陪清吟坐緑苔葉和秋蟻落僧帶野香來留客朝嘗酒憂民夜畫灰終期冒風雪江上見宗靁寄新定桂雍獨自住梅嶺鄰應是衲僧句須人未道君此事偏能塢濕雲霾觀溪寒月照罾相思不可見江上立騰騰寄烏龍山賈秦處士庭果色如丹相思夕照殘雲邊踏燒去月下把書看澗水仙居共忩風漆樹寒吾君方仄席未可便懷安桐江間居作五首木落雨修修桐江古岸頭擬歸仙掌去剛被謝公留猛燒侵茶塢殘霞照角樓坐來還有意流水面前流香剎通真觀樓臺倚郡城隂森古樹氣羸淡老僧情壁畫連山潤仙鐘扣月清何須結西社大道本無生靜室焚檀印深爐燒鐵瓶茶和阿魏暖火種柏根馨數隻呼來鶴成堆讀了經何妨似支遁騎馬入青冥不問庚桑子唯師妙吉祥等間眠片石不覺到斜陽獨自收櫧葉教童采柏瓤王孫莫相笑淡泊味還長露滴滴衡茆秋成爽氣交霜椑如蜜裹岡葛似鹽苞淨癬侵蛩穴微陽落鶴巢還如山裏日門更絶人敲對雪寄新定馮使君二首仙掌空思歸未能焚香冥目對殘鐙豈知瑞雪千山合空覺春寒半夜增翳月素雲薶粉堞堆巢孤鶴下金繩因思太守憂民切吟對瓊枝喜不勝政化猶來通上靈豐年祥瑞滿窗明氣嚴坐久鐙凝焰片大更深屋作聲飄奄煙霞何處去欹斜杉竹向簾傾雪林中客雖無事還有新詩半夜成登干霄亭已下六首陪馮使君遊擁翠捫蘿山屐輕飄飄紅斾在青冥仙科朱紱言非貴溪鳥林泉癖愛聽古桂林邊棊局濕白雲堆裏茗煙青因思廬嶽彌天客手把金書倚石屏遊靈泉院珂佩喧喧滿路岐亂泉聲裏扣禪扉對花語合希夷境坐石苔黏黼黻衣鳥啄古杉雲苒苒風吹清磬露霏霏惠嚴亦有孤峯在只戀翻經未得歸過相思嶺譽自馨香道自怡相思嶺上卻無機荒渠葉覆深霞在片石人吟一鳥飛何處風砧傳古曲誰家冢樹挂斜暉因思往事堪悲笑鶴背魚竿未是歸錦沙墩臨水登山興自竒錦沙墩上最多時雖云髮白孤峯好其奈名清聖主知草媚蓮塘資逸步雲生松壑有新詩翛然别是神仙趣豈羡東山妓樂隨釣罾潭境靜江澄無事時紅旌畫鷁動魚磯心期只是行春去日暮還應得鶴歸風破綺霞山寺出人歌白雪島花飛自憐亦在仙舟上玉浪翻翻濺草衣迎仙閣澗香霞影繞樓臺卷箔憑欄耳目開况從旌旗近鸞鳳可憐談笑出塵埃火雲不入長松徑露茗何須白玉杯誰道迎仙仙不至今朝還有謝公來夏雨登干霄亭上宋使君二首霽色澄鮮壑飲虹干霄亭上望無窮蟬驚殘雨疑秋早雷傍嚴城報嵗豐歸廟片雲銜紫電立查雙鶴唳仙風自憐四郡干戈日得在文翁教化中鄒魯封疆禾稼濃清吟孤坐思重重新詩幾獻蓬萊客逺夢仍歸菡萏峯野果一枝堪薦茗落霞數片欲燒松如何深得冥搜癖月磬聲聲歸去慵宋使君罷新定移出東館二首無為政化更何為到即生人嫗煦肥必似漢髙三傑去且將劉寵一錢歸玉階香惹麒麟步銀漢風驅鸑鷟飛為報蒸民莫惆悵陶鈞及爾更光輝祖筵四面煙花合江館深冬歸思長火斾畫旗風焰焰橘洲漁舍浪茫茫聽歌幾入紅蘭榭坐隱頻升白玉堂今歎不如沙磧鴈天邊一一得隨陽寄杭州宋使君公初罷睦州一自雙旌下釣臺望風吟苦凍雲開即歸紫闥天非逺猶憶烏龍首獨回髙節似僧僧共坐暮潮如雪雪中來應知新定蒼生淚灑向東風祝上台遊嚴陵釣臺雪浪皚皚萬古情岸邊臺占子陵名一時大器天將與數尺漁竿誰不擎危榭髙碑鐫籀字滄洲老鶴識先生遊人到此慵歸去庭樹孤猿有好聲新定江邊作江邊山頂深秋時身間蕭灑心無為石頭青草取次坐松風竹風撩亂吹數聲好鳥來依我一點征帆去是誰惆悵古賢何處在潺湲夕照滿江湄日落山照耀即此處也嚴陵集卷二
