body:
  text: 嚴陵集卷六宋董弅編詩賦獨樂園釣魚菴司馬光吾愛嚴子陵羊裘釣石瀨萬乘雖故人訪求失所在三旌豈非貴不足易其介奈何夸毗子斗祿窮百態次韻葛大卿留題寒光閣蘇頌溪凝藍黛合雙川閣在千巖萬壑前潄石我思清病齒拂琴誰共聽流泉雲生北嶺橫空白春入東郊一望鮮況是江南風物好待君重詠四時天送江公著知吉州蘇軾三吳行盡千山水猶道桐廬更清美豈惟濁世隱狂奴時平亦出佳公子初冠惠文讀城旦晚入奉常陪劒履方將華省起彈冠忽憶釣臺歸洗耳未應良木棄大匠要使名駒試千里奉親官舍當有擇得郡江南差可喜白粲連檣一萬艘紅妝執樂三千指簿書期會得餘閒亦念人生行樂耳二耳義不同故得重用舟過嚴陵灘將謁祠登臺舟人夜解及明已遠至桐廬望桐君山寺縹眇可愛遂以小舟游之作二絶蘇轍扁舟匆草出山來慚愧嚴公舊釣臺舟子未應知此恨夢中飛楫定誰催嚴公釣瀨不容看猶喜桐君有故山多病未須尋藥録從今學取衲僧閒題伯時所畫嚴子陵釣灘黃庭堅平生久要劉文叔不肯為渠作三公能令漢家重九鼎桐江波上一絲風絶句館甥宫裏歎才難當日同朝聽百官光武若知堯舜事至今那得子陵灘釣臺曹輔天地何曽著兩雄蟄龍飛去有冥鴻北辰夜動雙懸象南浦秋歸一釣篷自昔何人繼高躅至今兹地仰清風悲涼古意誰能盡落日江山醉眼中千峯榭吕希純古郡千山裏高臺六月涼開軒背城市伏檻即林塘白佛當平遠烏龍插昊蒼水風生枕簟嵐翠撲衣裳欲雨高峯暗新晴瀑布長稻塍分錦繡松嶺奏笙簧自昔多賢守于今載雅章承流叨繼踵主諾粗提綱夙樂阿蘭若端居最上方南津有禪侣默坐正相望紫翠樓豫臨瀟灑郡終日坐樓中樓上闢四門門開面面風南榮看馬目北檻對烏龍夕暝瞰兜率朝霞望高峯峯巒鬱相望紫翠千萬重中霄若笙篁天籟起長松直疑列仙侣駕鶴相過從趙清獻賞春亭遺直兼遺愛居今見古人殿中收白簡江上擁朱輪棟宇才函丈琴尊喜對賔繞亭佳木在長與物為春烏龍寺秀嶺竒峯接釣臺烏龍直北更崔嵬萬松合處虛亭敞千佛光中梵宇開林外瀑泉飛朔雪雲間寶藏轉春雷攀藤更入西菴路一聽支郎語劫灰承天思范軒范公當日守江濵本是西清獻納臣瀟灑溪山瀟灑郡太平天子太平民棠郊遺愛今仍在竹榭高吟迹已陳還憶開元宋開府相望仿佛見精神陳尊宿菴尊宿名方盛菴巖迹未穨織蒲隨日用儋版喚人回臨濟親推出雲門手托開于今兩禪派俱自睦州來靈香閣昔聞僧道開清淨本求佛談經悟教藏施藥蠲衆疾臨嶂起重閣最上構禪室靈香邈可繼壯麗固已軼桐廬瀟灑郡兹閣更竒崛峯巒互掩映松竹富䝉密我來一伏檻紫翠競森出塵襟與羈幘中坐恍已失清風來甚遠沖氣久彌逸東軒視蟠桃仙路如仿佛瀟灑亭郡因賢守得佳名水態山光會此亭雲外僧歸穿竹塢日邊鷗下集沙汀浮梁倒影橫雌霓寶塔張鐙疊萬星不獨班春行田野重緣香火叩禪扄高峯菴豫嘗登高峯近瞰碧溪塢老松如卧龍夾道忽騰翥危梯過百折直下看雲雨善導有遺蹤十佛從口吐嵗久缺其三塵埃誰復數佛夀儻能續佛像諒可補繞山行道迹會轉坦無阻中休有磐石蔽日多林莽安得德山流來為此峯主結茅孤頂上端坐訶佛祖玉泉菴瀑布巖東轉畫旗拂雲穿石上霏微抱溪修竹通千箇夾道喬松過十圍檐外一潭泓翠碧忩間萬斛濺珠璣使君不用笙歌擁潄玉聲中岸幘歸江氏園北渚南津路不遙鳴騶喜過定川橋竹間水榭涵虛碧林外山堂對泬寥地占上游真爽塏門通禪苑離塵囂游人未歎羣芳歇石磴杉松正後凋民表圓同菴翠竹菴前久不疑雨花巖畔更忘機何人得似江居士在定時多出定稀定川門江如丁字湊城隈長畏蛟龍鼓浪來門表奠川聊致禱職當求瘼愧非才兩灘漲定沙痕白七里山晴霧雨開放出庾家樓上月却留賔從少裴􅏆王氏亭池城外溪山知幾重獨憐池館占城中亭花不動波瀾細徑石相連島嶼通牀下繫船同醉傅尊前垂釣似仙翁王家最數烏衣巷莫廢江南舊士風朱氏園十里游山興盡回重留車騎𣢾郊扉中橋駕石臨清港危榭開軒挹翠微夾道松風吹酒面滿庭花氣襲人衣殷勤更謝華亭鶴引吭高聲送我歸和江民表韻陳瓘傅老東山水上浮𤣥沙六月雪重裘舊來消息今何在千里桐江月滿樓合江亭上楊時倚杖鉤簾兩水間晴光飛景上雕欄帆催畫鷁搏風去雲吐銛峯作劒攢平野煙浮迷遠目晚溪潮漲失前灘騎鯨一往扶桑近休問人間行路難登桐君山二首霜染溪楓葉葉丹翠鱗浮動緑波閒盤盤路轉千峯表冉冉雲扶兩港間掠水輕鷗晴自戲凌風高雁暮爭還結廬姓字無人會靜對庭隂一解顔翠崖千尺峙雲高樓殿翬飛壓巨濤檻外回峯自連著祇應潭下有靈鼇過七里灘二首拂雲高雁倚風摶下視平湖萬里寬搔首扁舟又東去錢塘江上看波瀾扁舟東下幾時還一席飛帆插羽翰回首嚴陵臺上月清風千古逼人寒過清溪渡天濶銜江雨冥冥上客衣潭清魚可數沙晚雁爭飛川谷留雲氣鵜鶘傍釣磯飄零江海客欹側一帆歸題贈吳國華釣臺君不見釣璜溪上白髮翁一竿西去追冥鴻田車同載非羆熊鷹揚烈氣如飄風又不見羊裘石瀨垂綸叟爽概陵天動星斗萬乘故人親訪求卧對鸞輿忍回首聖賢遇合自有時潔身亂倫非所知高風寥寥古已往較然得失知者誰君有釣臺臨橘水橘溪不與嚴溪比收身欲躡渭老蹤笑撚霜髯照清泚澄潭夜月秋光浮撇波短艇沿汀洲長繩巨石不能繫飛帆片席歸蓬丘巨鉤沈餌牽九牛一釣直取靈鼇頭修鱗擺鬛浪山起雲鵬飛翻忽千里踏雲馮翼上青冥一㸃孤光厠箕尾嚴陵釣臺漢綱久陵遲國柄授權室中興得英主威明戒前失三公經邦手吏事固精核功臣欲圖全猶不任以職矧兹故人分義等天倫戚卓哉子陵心秉哲因前識投身豢名爵豈但枉尋尺萬鍾雖天富樊雉非豫匹石瀨清且泚蒼崖聳而直揭竿事幽尋釣水鮮可食羊裘御冬溫衮繡未為益三旌屠羊肆義在不吾易用舍各有趣高風亘今昔題方氏清芬閣朱彥干戈唐季風塵中一代文章掃地空先生詩鳴最晚出句法未減元和工玉壺藏冰不受垢卜隱宛蹈嚴陵蹤至今名字照人目直與山水為無窮我舟南紀坐煩促接嵗風波仍轉蓬緬懷先生酌溪水梅花如霰落晚風清芬築室家有法亦見裔孫白雲翁叔今䇿得待三接仲也昔跨御史驄乃翁歸來三十載語笑但覺朱顔紅翁不見東飛百勞西飛燕南飛烏鵲北飛鴻人生游宦正如此我欲買田歸江東題嚴子陵釣臺泊舟釣臺側敬謁嚴子陵碧山如佩環水作鏘然聲定知千載後尚復有遺靈長嘯明月下緬懷今古情世利濁於酒末俗遭塵冥毫髮不一直戈矛豈相爭先生得高蹈萬鈞獨可輕持釣偶自適潛魚不吞醒清風在人耳凛凛見典刑不如臺下水方可濯塵纓寒光閣駕舟掠杭越小泊清溪門平生江令尹邀我溪南園丹碧氣成霞樓疏何鬱盤江城春事起臘候已向殘的皪小梅花暗香媚山樊冰髯絶可愛青士聨蒼官君家藝蘭畹嵗久蘭有蓀我生真漫浪嗜好無一存尚作山水想十年勞夢魂歷眼滄洲趣兹盟那可寒他年釣竿手來傍沈郎灘題釣臺江公望漢柄久顛置神鼎遂移新志士恥驕餌入山如避秦中興有世祖仄席在幽人𤣥纁載安車三反方來賔枕潄泉石久不羡北軍絪卧屈萬乘尊咄咄平生親箕潁志不奪槐鼎意從申歎息上輿去天子不得臣歸隱富春渚釣外無隱淪高名懸日月清風播松筠至今七里水不到南海津南海有貪水至今雙石臺獨與西山鄰古木下高鳥清漪行素鱗溪氣緑靄靄野蔓青緡緡客星照千古鄧萬安可倫手捉玉璜去出處各有因𤣥素久寂寞猿鶴叫秋旻題方氏清芬閣一室翛然斸翳荒嘯歌曾是傲羲皇春風自逐桐花老暖日時聞藥草香修竹幾年薶舊隱新詩到處發潛光從今應與嚴家瀨相對清芬一水長兜率寺鑑光閣三首高下人家隱亂峯淡雲籠日水浮空朝朝暮暮山容改總屬虛懷一照中皎皎長空迥絶塵青山雨後更逢春一奩古鑑新磨就誰是光明內外人風吹宿霧寶奩開滿目春容甚處來好值軒轅磨瑩手更無一物隱纎埃玉泉菴二首高蓋西來動四鄰青青豐草馬蹄勻平田淺水相因足野杏山梨次第春偃蹇長松如傲世歡呼好鳥似迎人翛然偶得棲真地方信浮名即是身十里五里花無主千山萬山春自忙少年意氣傾都市走馬橫來若電光泠泠古寺風吹屋羞死五陵豪俠場黃金散盡身無益獨有泉聲千古長再題逸士有高躅故山無世情黃花香靨落白馬赭睛明雲作朝昏瞑泉流今古聲王孫好歸去芳草又重生又題玉泉菴三首僻塢藏亂峯清流䕃修竹短䇿資遠游斗酒拓近局幽草不知名孤花送餘馥采芹踏青泥捫松憐舊緑寄言潁川子沒齒傷局促為君汨其泥與我濯雙足落崖碧水支流去隔竹黃鸝相應鳴飛絮落花迎野步細風輕暖爽人情天台大士碧峯頭林鎖檀煙凝不收誰坐胡牀揮玉麈一聲清磬晚悠悠玉泉菴江公著風暖客衣輕山行眼乍明人非少年事泉作舊時聲草屨春游倦茶甌午睡清不教身自在城郭暮煙生書靜勝院壁留別父老蔡肇青山雲半遮慘淡有離色溪水亦潺湲嗚咽當枕側男兒四方志百年一行役山水亦奚悲我自本無得父老挽我車灑淚半悽惻使君雖自力慙無理人術舉手謝父老意厚難報塞釣臺賦張伯玉山水縈回煙霞次開不見逋客空留釣臺地迥而清風不去情傷而往事俱來得魚之處猶閒﨑峗古砌壘土之功未沒重疊春苔伊昔子陵貪幽自遂辭光武之好爵樂富春之勝地雖無晦迹之勞亦有垂綸之事持竿一去長為避世之人疊石九層以盡平生之志爾乃憑高易感覽舊多傷塵事與清波不返紅蘋同白芷徒芳相逢投餌之時寒流渺渺始及臨川之日遠岫蒼蒼今古堪悲躋攀盡趣潮平昔日之岸風動當時之樹石上少留人間多故游絲亂舉初同觸目之疑野竹隨低忽有沈鉤之懼迹是人非蕭條晚暉萬里之碧嶂如畫幾片之白雲不歸鷺立斜分之浦魚驚半毁之磯盡日而風波莫問滿山之松桂相依既而悵望歸心裴􅏆舊址尋通樵之一徑下鳴湍之十里煙深釣處空懷迤邐之峯日暮臺前無限潺湲之水比夫燕昭王築而禮士漢孝武登以求仙構金玉之畢至遂塵埃之共捐曷若兹所成於自然峭壁參雲孕清景而無冬無夏寒潭徹底浸明月而千年萬年已矣哉幾歷芳時誰依茂躅秋風起兮浪白春色來兮水緑唯野鶴與輕鷗自往還於水曲釣臺賦錢協治平之初元孟春某之役於新定道出嚴子陵祠下作釣臺賦其詞曰造東陽之下流兮歷桐君之舊隱俯清瀨之淵回兮仰崇山之數仞即釣臺之故處兮發塵編而猶信濯七里之澄灣兮睎千齡之逸軫軿俎豆乎衆壑兮供百嘉之初萌湛尊罍乎麗澤兮揖明水之至清鏤肺肝而刻祝兮以恭弔乎先生曰在昔周衰秦亡兮漢氏為政天不厭亂兮炎靈中病翦諸夏之磐宗兮授五侯以魁柄肇陽平之曠貴兮資文母之永命混伊旦之穅秕兮極羿浞之梟獍俄絓禍於百粵兮內毒痛於九州逞焚如之虐焰兮孰可望於彼留逮淵龍之未躍兮嘗與世以沈浮繄冥冥之何算兮聊卒嵗以優游百六究而新族兮奉舊物以歸劉雖緯嫠以均慶兮曽故人之獨不順輟佞以辟禹兮或姑治其幽憂謂高卧其已足兮安有待於營求意友交之美初兮慕施止於艮背將食土則見臣兮非至高而莫對當駕車之三反兮終一言而見意噫巢父之纍刻兮豈好大而事懟蓋屈已以徇人兮有時遷而禍會孰與夫道雖高而身安兮名將顯而迹晦浼聊許以增高兮詎少移於故態此先生所以馳騖乎六合之外者也向若凝滯思於舊學兮垂餘慕於勳庸體蒲輪之安乘兮懷五兩之青銅彼且厠豫兮立大功之諸將責吏事之三公下焉則鄙陋而不足為兮上焉則鞅鞅而不我容設濡足以救世兮將助理以赴功則高密贊圖於擁節兮迄見褫於龍章新息誓亡於馬革兮至死謗於炎荒然後知先生照未然之成敗兮識幾至之存亡昭利而不動兮得光武而益彰者也又若氛祲方結鯨鯢未戮四海沸騰真人隱伏莫高匪山莫幽匪谷苟見誚於木石兮悵同羣於麋鹿蔑亢世之高蹤兮昧話言之駭俗雖不得與此臺而竝傳兮固亦無加損於自足此志士所以洞想兮矧精祠之可矚激芳風於穨波兮慨靈氣之猶畜恧造專於登高兮久裴􅏆而躑躅嚴陵集卷六
