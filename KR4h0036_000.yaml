body:
  text: 嚴陵集總集類提要臣等謹案嚴陵集九卷宋董􅀢編􅀢東平人逌之子也自著曰廣川蓋欲附仲舒裔耳紹興間知嚴州因輯嚴州詩文自謝靈運沈約以下迄於南宋之初前五卷皆詩第六卷詩後附賦二篇七卷至九卷則皆碑銘題記等雜文棻自序謂嘗與僚屬修是州圖經搜求碑版稽考載籍所得逸文甚多又得郡人喻彥先家所藏書與教授沈愫廣求備録而成是集中如司馬光獨樂園釣魚菴詩本作于洛中以首句用嚴子陵事因牽而入于此集未免假借附會沿地志之陋習然所録詩文唐以前人雖尚多習見至于宋人諸作自有専集者數人外他如曹輔吕希純陳瓘朱彥江公望江公著蔡肇張伯玉錢協李昉扈蒙劉昌言丁謂范師道張保雍章岷阮逸關詠李師中龎籍孫沔王存馮京刁約元綘張景修岑象求邵元馬存陳軒吳可幾葉棐恭劉涇賈青王達張綬余闢刁衎倪天隱周邦彥羅汝楫詹元宗陳公亮錢聞詩諸人今有不知其名者有知名而不見其集者藉棻是編尚存梗概是亦談藝者所取資矣惟􅀢序作于紹興九年而第九卷中有錢聞詩浚西湖記作于淳熙十六年上距紹興九年凡五十一年又有陳公亮重修嚴先生祠堂記及書瑞粟圖二篇作于淳熙乙巳重修貢院記一篇作于淳熙丙午亦上距􅀢作序之時凡四十七八年則後人又有所附益已非􅀢之本書要亦宋人所續也乾隆四十五年四月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀嚴陵集原序詩三百篇大抵多本其土風而有作聖人刪取各繫其國如二南皆正風也周召既分陜而治則繫詩有不得而同三國當變風之始邶鄘既并于衛邶居衛北而詩有北門以興出門而北歸于邶也鄘居衛東而詩有載馳以興東徙渡河而廬于漕也衛在河之北而詩有河廣以興杭葦而南適于宋也是三者皆衛詩而以所收之異隨其國繫之其它蓋可類見使夫後世觀詩者因土風而知國俗則秦勇豳儉鄭淫魏褊皆自乎此而得之矣近代有裒類一州古今文章敘次以傳者其亦得聖人之遺意歟自東漢之末孫氏據有吳粵之墟始分歙縣之地建為新安郡逮隋而更郡名新定大業改為睦州唐初即桐廬縣别置嚴州尋廢州以縣來𨽻至國朝宣和中始復今名蓋以子陵釣臺為是邦重故以名州州境山水清絶著稱自古歷考前代朱太守以文學備應對之臣於西京後世則有皇甫持正方雄飛李德新施肩吾徐凝咸以詞章名世文為世傳而紀詠其鄉里為多今代如江民表全名直節見推于時文采蓋其餘事至于騷人名士過焉而賦者在晉則謝康樂梁則沈隱侯唐則李太白孟浩然白樂天羅隱國朝則梅聖俞蘇子美龎莊敏公王文公其牧守之有文在梁則任彥升唐則杜紫微國朝則范文正公趙清獻公以至吕子進蔡天啓又如張伯玉錢穆父皆嘗官于此者率多賦詠邦人傳諷逮今不絶而獨未有裒類而為集者雖有桐江集止載桐廬一邑之文而又繁冗不倫人不甚傳兹者弅與僚屬修是州圖經搜訪境內斷殘碑版及脫遺簡編稽考訂正既成書矣因得逸文甚多復得郡人喻君彥先悉家所藏書討閲相示又屬州學教授沈君傃與諸生廣求備録時以見遺乃為整比而詳擇凡自隋以上在新安郡者自唐以後迄國朝宣和以前在睦州者取之其未嘗至而賦詠實及此土如唐韓文公近世司馬溫公蘇東坡黃魯直蓋不得而不録也其有名非甚顯嘗過而賦焉一篇一詠膾炙人口者蓋亦不得而遺也嗚呼其亦庶幾詩人本其土風之作而聖人各繫其國之遺意乎乃若釣臺雙峙髙風絶企古今歌詩銘記居多編之此集有不容略故總以州名而為之標目云紹興九年夏四月壬申知軍州事廣川董弅序
