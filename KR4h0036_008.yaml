body:
  text: 嚴陵集卷八宋董弅編雜著碑銘題記睦州大㕔記刁衎王者列土以崇化諸侯供職以勤民故保乂庶邦而緝寧大範然則良二千石所以稱共理之才肇十二州所以光無外之德唐虞之秩可紀龔黃之政必陳古今不渝理道斯著睦州新定郡者天中勝概浙右奧區環繞翠山練傾澄瀨軒后登遐之地南顧連岡嚴陵垂釣之臺北由屬邑髙風盤礴爽氣裴􅏆歷代名賢出牧是任者蓋多矣按隋書仁夀中以睦而命郡者取其俗阜人和內外輯睦之為義也若乃星紀土風之候殖物産賦之宜昏明迭運之由廢置從時之理著於史䇿列在圖經此可梗概而不述也國家以天人合發文軌大同保我蒸民莫非爾刺以為漢之牧守入為三公則太重重則無篤固之心唐之郎官黜為五馬則太輕輕則有忽略之志所以矯前代隆殺之弊盛當朝欽恤之仁凡百屬官乘軺出牧皆以本秩而知郡事繇是政則不悖民以之和反軒昊之淳風躋富庶之夀域王猷所洽百世可知今知郡事田公以東觀之任榮右史之班察俗去苛觀風尚禮下車為政朞月有成墜典允修無文咸秩先是郡有正㕔記即唐本州刺史李道古所撰以前後牧守品名布於鉛槧綿歷既久殘缺則多不改成謀惟新舊制自唐顯慶二年至聖運太平興國三年之後所任刺史知郡咸列于左其有錢氏割據非王命者略而不書足以煥前哲之髙名俾後來之繼美假文屬吏以謹嵗時時大宋雍熙二年四月記嚴先生釣臺碑銘并序先生道藴於身名揚於後與世祖恩禮以旌其德東觀信書具載其事然而巢許抗志飲牛欲全其節也夷齊餓死扣馬以諫其君也至於逃其國而棄其家違其親而逺其兄者無足道哉未若先生遇故人而忘大位疾夫冒於寵名也游紫闥而隱青山戒夫溺於富貴也勵君以攘其私匿勗臣以保其公器教之大者此其志焉矧夫上動天文逺歸江漢進無苟而退無屈如雲之在空也動則平而靜則専如鐘之在虡也引釣溪流魚可得而榮不可就吕尚蹈厲之征所以愧也放懷林藪巖可築而名不可尊傅說舟楫之勞所以愧也矯激不亂於大倫耿介無偏於小節千古之下一人可知至今使遺迹煥然髙臺雙峙鄉閭多廉潔之行風俗盡樵釣之娛化之無窮道之彌逺與夫祿不及而焚於綿上義欲行而投於水濵者不可同日而言也衎嘗讀前史即仰遐蹤逮歷宦塗首宰鄉邑登髙臺而顧慕瞻舊域以裴回縣東南有子陵故城存焉願置曩懷以揚丕德銘曰天清地濁日行月運人稟粹靈道斯發奮和光同塵遁世無悶猗歟先生布兹大訓以君以臣兼退兼進私寵不留公議可振潁陽操微箕山義盡仰之彌髙磨而不磷依依雙臺峨峨千仞白雲悠悠清泚芳潤遺風不渝華壤可徇布之樂石永騰令聞淳化五年嵗次甲午正月七日建修夫子廟堂記田錫夫子之道布在六經深於六經者得其時遇其主而用之則王道明而萬物受其賜也夫子之廟列在郡縣典于郡縣者習其禮潔其誠而祀之則廟貌嚴而諸儒知所宗也不然則帝王之道未融卿大夫棄德背義而朝廷禮樂似是而非也祭祀之禮不修士庶民淫祀徼福而春秋享奠如存若亡也宜其宫垣閴寂草木羅生祠宇荒凉風雨不庇矧浙江之右桐溪之濱建邦于山谷之間居民多水潦之害巋然舊廟密邇通溝當子城東南之隅在故壘闉闍之下藩籬疏壞固無數仞之髙堂廡湫隘且非兩楹之制水至則几筵斯沒水落則塑像其穨不堪庳陋之憂安仰髙明之祀加以俗巫交惑徼求木偶之靈風教未還奔走金人之福逮乎祀先聖享先師食祿者忽略而不知為儒者流蕩而忘返錫以東嶽待封之嵗移殿是邦北戎薄伐之年議遷此廟人來獻地影亦庀徒宫贊溫仲舒僉謀之護戎張元吉輔成之督郵丘直方經營之七月某日興役也八月上丁釋奠也廟無祭器拜章以請之郡無經書上言以求之志素王之新祠成斯文也列門人之遺像題舊贊也翼翼諸廡不浹日而成慺慺衆心不俟募而至惜乎鄉飲酒之禮久廢人不知尊卑黨有序之學久廢人不識亷恥列郡無軒縣之樂祭不足觀在笥非衮冕之衣禮不足取白華南陔之詩寢則無以警不孝不悌之心頖宫齒胄之儀亡則無以訓為臣為子之學然廟不立則釋奠無所就禮不備則釋菜無所觀是以築為儒宫修其祀事請籩豆之古器復牲幣之舊儀祭之者可以交神明觀之者可以知勸教神明交則福至勸教明則化行夫世之澆淳在乎時禮之用舍由乎上故顔回謂舜亦人也孟軻曰回亦人也若然則克念謂之聖罔念謂之狂必祖述夫子之至仁憲章顔氏之亞聖則文中子亦人也乃知取法於延陵季子問禮於柱史老聃生而知之乎學而知之乎勉人之學讀是碑也遷廟之志見是記也罪言者得於斯知言者得於斯時雍熙三年八月某日記嚴先生祠堂記范仲淹先生漢光武之故人也相尚以道及帝握赤符乘六龍得聖人之時臣妾億兆天下孰加焉惟先生以節髙之既而動星象歸江湖得聖人之清泥塗軒冕天下孰加焉惟光武以禮下之在蠱之上九衆方有為而獨不事王侯髙尚其事先生以之在屯之初九陽德方亨而能以貴下賤大得民也光武以之蓋先生之心出乎日月之上光武之量包乎天地之外微先生不能成光武之大微光武豈能遂先生之髙哉而使貪夫亷懦夫立是有大功於名教也仲淹來守是邦始構堂而奠焉乃復其為後者四家以奉祠事又從而歌曰雲山蒼蒼江水泱泱先生之風山髙水長嚴先生祠堂記篆者名希深撰子真書中立題伯起立髙平以諫官貶守睦始訪七里瀨立嚴子祠召溪口僧恱躬畫古衣冠作嚴子像既成自作記聞丹陽隱者邵竦篆有法遂以刻石咨焉竦未嘗篆於人篆此獨不讓雖然不肯見其名會子真使來又深於篆者重之且恐其不彰使僕名之更自篆石於其石之仄聖宋景祐四年三月四日與邵竦先生書先生邵公足下某今春與張侍御過丹陽約詣先生維舟水邉聞先生歸山所謂其室則邇其人則逺惘然愧薄宦之不髙矣暨抵桐廬郡郡有嚴陵釣臺思其人詠其風毅然知肥遁之可尚矣能使貪夫亷懦夫立則是有大功於名教也乃構堂而祠之又為之記聊以辨嚴子之心決千古之疑又念非託之以竒則不足傳於後世今先生篆髙出四海誠能枉神筆於片石則嚴子之風復千百年未泯其髙尚之為教也亦大矣哉謹遣郡校奉此恭俟雅命與晏尚書書伏自春初至項城因使人回曽草草上謝由潁淮而下越兹重江四月幾望至于桐廬回首大亳忽數千里日思奏記敻乎無階恭惟蕃宣之居鈞體惟寧赫赫之瞻日以增重仲淹罪有餘責尚叨一麾敢不盡心以求疾苦二浙之俗躁而無剛豪者如虎示之以文弱者如鼠存之以仁吞奪之害稍稍而息乃延見諸生以博以約非仲淹所能蓋朝家之條教師門之禮訓也又郡之山川接于新定誰謂幽遐滿目竒勝衢歙二水合于城隅一清一濁婺江濁歙江清如濟如河百里而東遂為浙江漁釣相望鳬鶩交下有嚴陵之釣石與方干之隱茅又羣峰四來翠盈軒窗東北曰鳥龍崔嵬如岱西南曰馬目秀狀如嵩白雲裴回終日不去巖泉一支潺湲齊中春之晝秋之夕既清且幽大得隱者之樂唯恐逢恩一日移去且有章阮二從事俱富文能琴夙宵為會迭倡交和忘其形骸鄭聲之娛斯實未暇往往林僧野客惠然投詩其為郡之樂有如此者於君親之恩知己之賜宜何報焉今有郡齊歌詩一軸拜獻庶明前言之不誣爾干瀆台嚴伏增戰懼尚逺門下伏惟尊察為國自重題徐常侍篆桐廬縣額張伯玉桐廬縣額故左省常侍徐君之篆也篆自秦丞相斯以名烜天下歷漢魏以降學者亡數至唐中興始得李陽冰繼之陽冰後又無人焉至于我朝有徐君自秦到今幾一千五百年以篆名家者三焉天下之人言篆者不歸于三家則無所祖尚也其為字之寶雄乎其傑藝乎始徐君與秣陵刁侯衎俱事江南李氏號為名臣後從其君歸于我刁初得太祝為桐廬宰徐君以率更令留禁中嘗以版素馳京師劬而得之遂揭之于今今之賢士大夫道東南者過七里瀨則訪子陵釣臺至桐廬則必觀徐君之篆其名也豈虛然哉皇祐初吾進士同年之子曰彭城劉斁以清白長是邑且虞其速朽走奉錢抵具區買洞庭石來命工摹刻于署堂之左方請吾言以表之夫古之人所以能流聲名美風俗使百世之後談娓娓而不絶者皆有以起之也然則異時講桐廬之故事者兹可泯乎常侍名鉉字鼎臣廣陵人其儒學節義與其籀為世寶者悉書于太史氏兹不復贅五年冬十有一月至日吳郡張伯玉題公堂銘碑斷闕上文止録見存者張伯玉闕知人道之大而治亂之不常也故有斆學以本焉然則學也者總天人之公道乎人君用之以敘羣臣以睦四海多士由是以明盛德以毗大業所以張天下至公之法用敷于天下無德而名焉又豈徒游是庠登是堂觀簠簋聽鏗鏘茍習句讀而已哉銘曰猗歟公堂邦家之光彌綸奕世景行百王道尊則勝人存克揚於穆頌聲與時無疆睦州學進士登科題名記趙抃睦於吳會為裨郡蒼嶂寒瀨齒齒激激風土物色縹渺秀巧鍾氣生士翹俊殊甚其學校自文正公基之談經治文出乎其間日益盛金部向侯奉慶厯詔更廣堂舍學者為便距今業精而上第無虛榜數十年間以今較昔得人為三倍夥是以知學之廢興在人士之進退由學聖時之明勸也然士之所謂學誠心竭力企古聖賢道將至其所未至者也爵位于朝仰首信眉掌握當世務與奪非是出呼吸間一率以正然後盡臣子忠義之分稱人君敦勉之意脣吻小巧剜章刻句而已乎因萃前後登第者名諸石後來繼焉嘉祐三年戊戌正月元日記桐廬縣令題名記倪天隱三代分土諸侯世國以治斯民曰吾君也其可逃諸侯曰吾民也其可解故其心相孚而化治日起且其地大不過百里嵗淹月積其纎悉視民不翅如照矧瓌材瑋行其能久閉約於其間哉官以器任則士能盡士以鄉進則民事悉萬㝢以概國其有忽而不治者邪秦壞先王法廢為郡縣其守令丸移而奕易萍轉而蓬飛斯民曰彼且去吾善庸何為吾惡庸何傷官者亦曰吾且去是非吾民吾安能汨汨自勞苦為故其孚誠不交而卒以茍道而曰欲歸民於三代是棄食以求飽也或曰三代以侯治漢唐以郡縣治其治一其亂也均適一時之宜者不必皆先王之法是大不然夫宿姦巨蠹譬諸蚊羣陽闢天曉日發旦則聲喪影滅投迹自晦及微隂斂昏萬景垂夕則復薨然起嘬噬之患矣賢否相易其昏明之交乎抑有大不可者夫郡縣之官凡幾位天下之士凡幾人雖有堯舜之明湯文之智不能必察而材諸位況紛紛然若百貨之市其屢遷而亟貿也嗚呼生靈之伸屈存乎令守取煆鍊成案取正於法而已是令尤為親切於民桐廬故吳分富春縣置屬吳郡隋仁夀始用屬睦中間𨽻屬不常然獄訟賦役便於睦故我宋因之自錢氏以地歸江南刁公以直道自信出宰是邑自爾以瀕海幽遐不為要壤而風教不能浹斯民不識仁義之化亦往往受敝主上至仁始用薦者得補令而間為得人及其敝言上者以私而民之得善令者天也榮君資中文敏而明務以靜治雍容閲案籍得雍熙以來為令者姓氏第而刋之其政之善惡則皆昭然著在人口賢者少不賢者衆則其官人之得失可以鑑而後來者足以自發俾其企善而懲惡亡斯民之病以為石羞嘉祐七年四月二十三日睦州新作浮橋記錢協睦古鄣會稽之地據浙江上游當閩粵甌駱黟歙鄱陽數道之衝又南出交廣五嶺屬之徼外雖别道循江絶湖率多巨風駭浪漂溺濡滯之患淹久嵗日使程賈資度不時至輕裘版輿木楗揭篋由此塗出者常居水道之半郡治建德東陽江與歙溪二水合於南東湍悍奔激夏輒暴漲雖窮冬沍涸深不可涉故四方之賓客至者解鞍弛儋倚立露坐而與夫郊野之人抱布囊粟負芻荷薪以輸縣官以趨市門者賈組易鎛左提右挈以返田里以行慶豫者纍纍然雜進兩涘引吭頓足以須舟子泝沿上下移晷乃復探懷出金而後得濟烈風驕陽其畏僵暍今上治平之初元工部郎中吳興劉公罷按察荆湖北道來臨是邦不鄙其民以自暇逸又不為赫赫名聲以發取騰踔奬善禁惡一出於愷悌郡遂以大治若無可經意故所思者益靜以明而所及者益巨以博明年始命行歙溪之陕中直郡城之南隅維舟以為橋闕積功傭千有七百自十二月庚闕既成公以其屬落之且曰是急闕名宜無所論著惟後之人知鳩闕不侈也無憚其繼焉則滋久而闕紀因屬之於協愚以謂治古學闕斯民者無進退夷險內外輕重闕行吾志者當幸遇而勇為之惟闕蓋若此此其可以刋之金石而闕亦有以求其意也治平三年嵗闕亥會稽錢協記闕靈香閣記闕棟宇可以庇風雨臺榭可以逺闕肅賔客山川可以廣眺望此居闕為浮圖者之說則不然曰不閎闕大不盛麗不足以來信嚮故惟闕而不已既已閎麗矣而吳越之闕丹雘金碧斫礱炫熀至於殫人闕而不知止故其山林之峻深郊闕之所卜智士之所營非為浮圖闕也思允師居睦州兜率寺之法華院佛學之外兼妙歧黃之術人有以疾病告者必盡其技而為之診視凡湯液之所餌砭針之所加無不如期而應自郡官至于編户皆稱其方技之神良而功施之周普由是車馬之踵門者日月相繼而不絶也嘗患其居宇之湫陋賓至無所容遂闢故址革而新之又於其傍為閣三間楹桷崇髙軒檻虛明經像嚴於中草石蓄於次闕左右布列藥欄華圃前後相望升其堂則聞芝术之芬氲游其庭則見竹樹之䕃翳雖密邇闤闠而山居巖處之趣備焉考成之日太守集賢王微之率賔寮燕飲其上且嘉儲偫之美因題其顔曰靈香又賦詩以紀其事繼而作者二車史館劉元忠也觀二詩則院與閣之所有皆可見矣後三年余自東陽赴亳社愒郡郵會故人留止過允之居因得一游目焉嘗謂桐廬郡溪山之清絶自晉宋以來文士多稱述之往往載於題詠觀夫城邑閭井皆坦塗平陸蓋與它州無有異也及登髙而望則羣峰回環一水縈帶煙雲暗靄朝暮異狀不離指顧而萬景在目信乎吳越之佳郡前人之所稱詠不為虛談也而兹閣又占一郡之勝處髙髙下下皆有幽致是為端居造適之樂復以甘辛寒溫之上味給人朝夕之求其為利固已博矣然則不得與夫競土木而誇閎麗者並也宜乎微之元忠歎賞之勤勤如此因書所見以繼二詩之後云時熙寧五年二月十五日記元祐元年正月十五日上石題嚴先生釣臺葉棐恭漢嚴子陵先生釣臺距桐廬郡城五十里異時人迹罕至景祐中文正范公謫守是郡始即臺下構堂以祠先生親記其事屬丹陽隱者邵竦篆之刻石今存于郡廨又命會稽僧恱躬畫古衣冠作先生像于堂中既而過祠下望唐處士方雄飛之舊隱周覽裴回慨想餘風因復圖其像于堂之東壁自是往來之人鮮不登堂致禮者激貪立懦非曰小補嵗月滋久棟宇漸墮上漏側穿像亦故暗且地勝事絶至者喜留名迹而狂易之徒往往及像之面目甚非所以伸䖍妥靈聳人觀瞻之意乃以僚屬葺堂而完之始為塑像以易繪畫庶幾二髙人之清標儼然長存而文正公之遺迹愈逺不泯也元祐元年六月朔日朝請大夫知郡事延平葉棐恭題敕賜唐二髙僧師號記周邦彥有二大士顯於有唐在新定城住阿練若咸舉宗教轉大法輪曰陳尊宿舍衆居守今賜號兜率以圓通門隨彼機緣引接沈冥度無量衆曰善導大師乞食城中處髙峯山築壇誦佛從者三千開口發聲一一化佛重纍而出方便善巧修淨土行其故道場皆有遺像而奉事弗䖍稱號無聞為日久矣元符二年馬公玗來守是邦始致崇敬雨暘請禱如響答聲請命於朝乞加褒顯元符三年十二月二十四日命下賜尊宿號曰悟空禪師善導大師為廣道大師明年三月十七日具花幡威儀表揭新號為僧伽梨被服二像州民大集巷無居人時方霪雨昏翳充塞導迎之初黃霧搴除赫日顯照開闔隂陽成於奄忽萬口嗟異得未曽有竊聞真一法中毫芒不立況此名謂何所加損然諸聖諦雖談實相不廢假名故雖有漏世界十二類生外道狂解十禪那目業果酬答一十八天乃至信住行向地為位五十菩提涅槃真如佛性唵摩羅識空如來藏大圓鏡智七種名字乃至過去無量億數果地正覺莊嚴名稱皆依空建立初無實義以假名字引導衆生從佛至佛所不能已則二大士加號崇飾義亦復然法身現前亦應攝受而馬公夙植德本深達苦空示宰官身而作佛事平等施德如物䝉雨與者不有而受者不懷平等施刑如人觸刀割者無怒而傷者無怨故能嗣續真風尊禮先覺開發勝利為四衆首因緣會遇適當斯時知其由者可無人乎年月日錢塘周邦彥記睦州政平橋記江公望太常丞李公勉之為是州也州人安之政之在事者有條事之在物者有理簡而不疏文而不害日閲百千牒訴應手而解老胥黠吏束手旁觀終莫得其間無終訟無留獄郡稱為神明乃欿然猶以民隱為憂州之南有大源其源西出於歙合婺水東注于大江夏秋雨淫二水鬭湍悍決溢齧高岸拔大木州人患之行道所會前值甌閩江南浙東郡邑之民源源而來後奠杭歙通塗支道躡踵而至適二水之患弛負解槖駢肩重足徯渡者積日依山之民平旦負薪芻裹果木之實趨城市以貿朝晡之膳老稚仰哺至夜暮不得食工部劉公述創為浮梁悉弭斯患出於倉卒未有為修完之計者故不五十年而毁矣前日之患復見於今日我侯心存之而戚見於顔色州人相謂曰我侯我父母也豈以一浮梁而貽我父母之戚子各率緍錢付僧守慧等董其事木美工善籌畫有度其袤相望視人若巨擘其廣肩任負戴雖若連雞乘雁交臂而分馳不相留礙力之所任百斛不墊隱若平地然會費無慮數百萬裒餘金粥田為異時修完之利水之東南有天寧佛祠是祝吾君萬夀之地百官走趨閲月而祝無有險艱此又食土之人所當竭力者也成以政和四年甲午正月丙寅二十有九日丙午越二月二日我侯率官屬如天寧以落之所以祝吾君也嘗請名於公望竊謂昔周之王使單襄公假道於陳以聘楚火朝覿矣而川不梁歸告王曰陳侯國必亡王問故對曰天根見而水涸水涸而梁成先王之教也又曰十月成梁夏后氏之令也先王不用財賄而廣德於天下者以此今陳火覿而川無舟梁是廢先王之教令也不亡何待夫川梁之廢興足以知政之得失安可忽哉先王之教寓之於政其令著之在法孟軻謂子産當大國之政區區於一濟人之惠而不知政法之在人也政法不行是無先王之教令也故曰君子平其政行辟人可也政平則教行所以得人心法行則令著故民聽一而不惑是以此邦之人不出於驅迫歡然致力不一豪取縣官財賄咄嗟而成方來之人厚享我侯之德利非以政平故邪因以名之有觀其名而心惟其義不復為怠偷之政是橋也其利新新曷窮已哉越二日庚戌江公望記九峯菴記天下事不獨事始為難卒之又難事之始必於艱難慮患之時故其思深其力勤卒之者常在安逸無事人情軟熟之後罔不縱弛怠偷鮮克有成僧智日以九峯造立卒業具述本初屬余記之余猶能憶少時之游敝屋數間入其室閴若無人僧醉寢藍縷過午未飯然其山峯之羅列者九肩差踵後襟繞帶絶漫不省出入蹤徑竹松茂密光景蔽虧窄窄聞摧枯拉朽聲不見其人距郡城不數里若在深雲杳靄間靈區奧壤鬼神靳惜不以示人居之久難其人也比丘清鑑行髙德巨心地穩密州破甲乙以鑑來尸屬久敝之後用力艱用心益精敏居無何人化其德施手開展締構一新既而以老告州復用甲乙以其徒智日代之方艱難慮患之時非巨有才德莫能經畫圖回一代之成績不可不吝其擇甲乙非其人安可使也有維有綱既立既張凡百悉蹈繩檢世其業雖中才可也況其人精悍多智畫苦身克意雖在安逸無事人情軟熟之後毅然有為以卒其業事無固必顧得人如何耳搜之甲乙何負於人哉佛有新祠寢飯有堂庖有儲有餼澡有室鐘有架屋纍然坐方丈其徒烏呼稽首成一保社日之力勤矣哉諸峯著丙方者最為秀絶易佛祠值之其盛固日之力然形勝古有之政和五年乙未記明年二月甲戌書之興福院記凡出於心之所同然者雖夷夏異區貴賤愚智少長之不相若寥寥歷數千百年得之者如出一揆心猶虛空無毛髮介然空缺處谷滿坑滿牛豕鼻喙滿汙邪甌寠滿提攜負汲亦滿終莫有德其賜者蓋終身由之不知其然也至於灑然若醉醒夢覺當有自來矣何村建德一聚落土風沃美兒田婦桑無有啙窳功不十而利百之家饒財桀驁易侮之心生使酒尚氣椎牛博戲攻剽為姦馳死地如騖一旦强力惡少革心為善良門閭櫛比唯善之為慕西屬天寧佛祠學道者過而問焉東北距興福是院廢於保昌至錢氏復興嵗在癸亥越甲午凡一百五十有三年政和初名額僅存穨垣廢址皆黃茅白葦飛走交午敝屋三數間居者無復僧事僧靈皎出緍錢八百萬施者亦如之建為殿者四能仁僧伽法輪十王之像設焉閣二鐘經虡櫝具在殿之隂為演法堂次為函丈之室挾以海會香積而門廡浹之凡諸莊嚴之具佛比丘諸所受用無一不備人之錢既入而探諸囊中如曳九牛之尾八百萬錢出於荒山窮褐者之手若非超然感悟越一切拘攣之語與其徒而應之者若流水趨下兹有以啓之者焉得於所同然者也由一佛祠破慳貪之疾化而為一鄉之善俗由一鄉化而為一邑之善俗其利曷窮已哉刑驅之不若訛其心使自得之故曰得其一萬事畢斯一也擬心即二焉有問速化之術余告之曰知此而已五年乙未工畢明年八月丁酉江公望記龍泉院記龍泉一斛水爾有龍常所託止焉召風霆疾呼起雲霧出肘腋間俄頃嘉雨四洽邑民德其賜作佛祠而庇焉因以龍泉名其祠靈區奧宅神物之所託是故山川草木沃潤而清美代有異人出焉有諸禪者莫知所自其髙道祕行人亦不知託於龍以福此方之人民以旱告甘澤之應若答響焉故嵗多穰而民力以饒僧奉齊錢忠懿王嘗召演法華文句於竹林寺學者數百雄經巨論博觀泛覽精簡妙義析秋毫矣歸老人漸其餘悔罪遷善為一鄉美俗可良四代孫也以禪學住本邑保安禪院一日有豕逸於屠刃之下徑趨而跪伏亢而視若有所訴而不得言頃之屠者至亟執之哀號可憐以金易之豢養久擾如善良之人畜無知也能逃死於萬無一生之地知所擇也知所擇謂之無知可乎不逃於比閭之居而逃於佛祠不逃於它比丘而逃於善知識余譬之善良之人不為過矣凡有心者物之偶也有偶則爭興唯無心故有心者歸之非有道者不處也師退居烏龍邑人挽之而不釋願修故龍泉院以為師處焉裒金粥材為殿一區法堂丈室兩廡三間悉具誦閲有經製為樞藏以待未暇閲者挽之以行燕居有室以需四方學者之至仰高明俯清泚宴寂之餘以為興居之適又有所謂水閣者在焉成於政和六年丙申三月壬辰越丁酉良屬余記其事一斛之水甚微龍託之而神變化自如霈為膏澤以福於人而佛祠託之以興一豕之生固不足道善知所擇而良之道行益著而佛祠託之以不廢矢激則逺水激則悍登高而望則見逺順風而呼則聲益厲所託者然也至於離人而立獨無所事託而良之道吾不得而知也唯菴記真悟老禪脫烏龍之縛結茅於其山之西岡以為宴休之地余一日訪之行新田間决决水流可掬可溉入其徑松杉青潤邑邑欲染人衣裓未到三數步小童候門一犬吠唶唶應竹作聲自是一山川風物楹桷無藻飾函丈之地唯留一榻牀敷隱厚經行之餘兀然危坐坐久即卧安穩無它苦與余說普通年前事率皆無味之談聽者欲寐余將歸肘余曰為我名此菴余名之曰唯菴三界唯心萬法唯識釋之者曰唯遮境有識簡心空遮有則一心獨照簡空故萬法摐然心法相望非不二境余别為之釋曰三界唯心一心唯菴不遮不簡唯境唯心聽者霍然失寐掉頭拊髀爵躍而歌曰心唯菴兮菴不知但見白雲朝起東山飛菴唯心兮心不住明月前溪夜流去朝朝暮暮何時了是中本不同生老一衲䝉頭百不為又是青山歌好鳥歌罷真悟老與余相目一笑解袂以歸釣臺翁江公望正月十九日記實政和丁酉嵗也改定川門請僧看經疏文呂希純伏以川在境內斯民所依水由地中於性為得粵維新定之野適處兩溪之交爰自比年以來頗違潤下之理顧兹城闕密控津塗乃涓令辰載揭嘉號集禪關之清衆課華藏之祕文並集勝緣庶申善禱謹於南山廣靈禪寺請比丘八十一人就定川門轉大方廣佛華嚴經一部八十卷行願品一卷並用回向歙婺兩港一切龍神伏願由斯法供諒乃誠祈仗慈力之無邉運神光於莫測妥安源流之道永却驚瀾保佑室廬之氓俾諧寧處伏惟三寶俯賜證明謹疏請刻石跋江公望歙婺二水為睦州之患嵗必一至或再至焉壞城決隄敗積儲毁廬舍中夕弛備遽及寢户居民破屋以出其不為魚亦幸矣前昔州郡患之終無扞禦之策雨久作二水爭行山夾岸如束壅遏不得去故有是患非可與智力爭也舍人吕公盛德君子愛民出於誠心嘗祭二溪之神其文州人猶能記其仿佛水潦暴行更相遜避若兄弟然詞意惻怛惜乎不傳易門額為定川揭之日復有文請禱於釋氏由定川而後凡二十有一年不復有水患水無情也可告語者神爾神與人不可以言語傳也所可格者誠爾誠不可以虛拘也所以達其誠者斯文在焉訪求纍年今始得之願刻諸石以貽將來不墜斯禱惠莫大也政和四年甲午二月初五日江公望書嚴陵集卷八
