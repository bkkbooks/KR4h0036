body:
  text: 嚴陵集卷一宋董弅編詩七里瀨謝靈運羈心積秋晨晨積展遊聎孤客傷逝湍徒旅苦奔峭石淺水潺湲日落山照耀荒林紛沃若哀禽相呌嘯遭物悼遷斥存期得要妙既秉上皇心豈屑末代誚目覩嚴子瀨想屬任公釣誰謂古今殊異世可同調新安江水至清淺深見底貽京邑遊好沈約眷言訪舟客兹川信可珍洞徹隨深淺皎鏡無冬春千仭寫喬樹百丈見遊鱗滄浪有時濁清濟涸無津豈若乘斯去俯映石磷磷紛吾隔囂滓寧假濯衣巾願以潺湲水沾君纓上塵嚴陵瀨任昉羣峯此峻極參差百重嶂清淺既漣漪激石復奔壯神物徒有造終然莫能仗贈郭桐廬出溪口見候余既未至郭仍進村維舟久之郭生方至朝發富春渚蓄意忍相思涿令行春反冠蓋益川坻望久方來萃悲歡不自持滄江路窮此湍險方自兹疊嶂易成響重以夜猿悲客心幸自弭中道遇心期親好自斯絶孤遊從此辭清溪二首李白清溪清我心水色異諸水借問新安江見底何如此人行明鏡中鳥度屏風裏向晚猩猩啼空悲逺遊子清溪勝桐廬水木有佳色山貌日髙古石容天傾側綵鳥昔未名白猿初相識不見同懷人對之空歎息經七里瀨孟浩然豫奉垂堂誡千金非所輕為多山水樂頻作泛舟行五嶽追尚子三湘弔屈平湖經洞庭闊江入新安清復聞嚴陵瀨乃在此川路湍嶂數百里沿洄非一趣彩翠相氤氲别流亂奔注釣磯平可坐苔磴滑難步猿飲石下潭鳥還日邊樹觀竒恨來晚倚棹惜將暮揮手弄潺湲從兹洗塵慮至七里灘作李嘉祐遷客投於越臨江淚滿衣獨隨流水逺轉覺故人稀萬木迎秋序千峯駐晚暉行舟猶未已惆悵暮潮歸入睦州分水路憶劉長卿北闕忤明主南方隨白雲沿洄灘草色應接海鷗羣建德潮已盡新安江又分回看嚴子瀨朗詠謝安文雨過暮山碧猿吟秋日曛吳洲不可到刷鬢為思君送張十八歸桐廬劉長卿歸人乘野艇帶月過江村正落寒潮水相隨夜到門卻歸睦州至七里灘下作南歸猶謫官獨上子陵灘江樹臨洲晚沙禽對水寒山開斜照在石淺亂流難惆悵梅花發年年此路看對酒寄嚴維陋巷喜陽和衰顔對酒歌懶從華髮亂間任白雲多郡簡容垂釣家貧學弄梭門前七里瀨早晚子陵過睦州送尊師醮畢還越吹簫江上晚惆悵别茅君踏火能飛雪登一作吞刀入一作吐白雲晨香永日在夜磬滿山聞揮手桐溪路無情水亦分按覆後貶官赴睦州奉贈苗侍郎制使地逺心難達時危謗易成羊腸留覆轍虎口脫餘生直氏偷金枉于家決獄明一言知已重片義殺身輕日一作月下人誰憶天涯客獨行年光銷蹇步秋氣入衰情建業一作禪知何在長江問去程孤舟百口淚萬里一猿聲落日看鄉路空山向郡城豈令寃積氣千古在長平新安江送陸灃歸江隂新安路人來去蚤潮復晚潮明日知何處潮水無情亦解歸自憐長在新安住酬皇甫侍御見寄時前相國姑臧公初臨郡離别江南北汀洲葉再黃路遙雲共水砧逈月如霜嵗儉依仁政年衰憶故鄉佇君宣室召漢法倚張綱酬張履雪夜發桐廬訪别途中苦寒之作扁舟乘興客不憚苦寒行晚暮相依分江湖欲别情水聲冰下咽沙路雪中平舊劒鋒鋩盡應嫌脫贈輕余浦橋月下重遊秋風颯颯鳴條風月相和寂寥黃葉一離一别青山暮暮朝朝空江漸出亭岸老樹猶依斷橋明日行人已逺空餘淚滴回潮七里灘重送嚴維秋風渺渺水空波越客孤舟欲榜歌手折衰楊悲老别故人零落已無多赴新安贈别梁侍御新安君莫問此路水雲深江海無行迹孤舟何處尋青山空向淚白日豈知心縱有餘生在終傷老病侵酬李穆見寄孤舟相訪至天涯萬轉雲山路更賒欲掃柴門迎逺客青苔黃葉滿貧家新安江奉送穆諭德歸朝賦得行字九重宣室召萬里建溪行事直皇天在歸遲白髮生用才身復起覩聖眼猶明離别寒江上潺湲若有情題元録事開元寺所居幽居蘿薜情髙卧紀綱行鳥散秋鷹下人間春草生冒嵐歸野寺收印出山城今日新安郡因君水更清送張栩扶侍之睦州遙憶新安舊扁舟復卻還淺深看水石來往逐雲山入縣餘花在過門故柳間東征隨子去皆隱薜蘿間奉使新安自桐廬縣經嚴陵釣臺宿七里灘下寄使院諸公悠然釣臺下懷古時一望江水自潺湲行人獨惆悵新安從此始桂楫方蕩漾回轉百里間青山千萬狀連崖去不斷對嶺遙相向夾岸黛秋色沈沈渌波上夕陽留古木水鳥拂寒浪月下扣舷聲煙中采菱唱猶憐負羈束未暇依清曠牽役徒自勞近名非取尚何時故山裏卻醉松花釀回首惟白雲孤舟誰復訪嚴陵釣臺送李康成赴江東使潺湲子陵瀨倣佛如在目七里人已非千年水空渌新安江上孤帆逺應逐楓林萬餘轉古臺落日自蕭條寒水無波更清淺臺上漁竿不復持卻令猿鳥向人悲灘聲山翠至今在遲爾行船晚泊時使還七里瀨下逢薛承規赴江南貶遷客歸人醉晚寒孤舟暫泊子陵灘憐君更去三千里落日青山江上看重别嚴維月色今宵最明庭間夜久天清愁寂多年左宦殷勤逺别深情溪臨修竹煙色風落髙梧雨聲耿耿相看不寐遙聞曉杵山城新安非欲挂帆過海內如君有幾多醉裏别時秋水色老人南望一狂歌寄劉員外皇甫曽南憶新安郡千山帶夕陽斷猿知夜久秋草助江長鬢髮應成素青松獨見霜愛才稱漢主題柱待田郎發桐廬先寄劉八丈員外李穆處處雲山無盡時桐廬南望轉參差舟人莫道新安近欲上潺湲行自遲耶溪書懷寄劉長卿員外寓睦州秦系時人多笑樂幽棲晚起間行獨杖藜雲色卷舒前後嶺藥苗新舊兩三畦偶逢野果將呼子屢折荆叉亦為妻擬共釣竿長往復嚴陵灘上勝耶溪寄皇甫湜韓愈敲門驚晝睡問報睦州吏手把一封書上有皇甫字拆書放牀頭涕與淚垂泗昏昏還就枕罔罔夢相值悲哉無竒術安得生兩翅送皇甫湜赴舉馬異馬蹄聲特特去入天子國借問去是誰秀才皇甫湜含吐一腹文八音兼五色主文有崔李郁郁為朝德青銅鏡必明朱絲繩必直稱意太平年願子長相憶贈施肩吾張籍世間漸覺無多事雖得空名未著身合取藥成相待喫不須先作上天人送施肩吾東歸知君本是煙霞客被薦因來城闕間世業偏臨七里瀨仙遊多在四明山蚤聞詩價傳人遍新得科名到處間惆悵灞亭相送去雲中琪樹不同攀西山即事奉寄故園徐處士施肩吾僕作江西少施氏君為城北老徐翁詩篇憶昔歡相接顔貌如今恨不同世界盡憂蔬上露時人皆怕燭前風唯余獨慕神仙道芥子雖窮夀不窮桐廬廳覩論事叟擾擾廳前走羸瘵中有老人扶杖拜天公霹靂耳不聞猶為子孫爭地界秋日桐江送裴秀才歸淮南怪來頻起詠刀頭桐樹枝邊一葉秋又向江南别才子卻將風景過揚州題釣臺蘭若山僧不釣臺下魚幾年空寄臺邊坐有時手把乾松枝沿江乞得沙上火歸分水留贈王少府仙吏飲冰多玉聲新詩麗句遺狂生不愁日暮歸山去故把隋珠入夜行過桐廬場鄭判官滎陽鄭君遊説餘偶因𣙜茗來桐廬幽竒山水引髙步暐曄風光隨使車算緍百萬日不虛吏人叢裏唯簿書眼前橫掣斷犀劒心中暗轉靈蛇珠有時退公兼退食一尊長在朱軒側胡商大鼻左右趨趙妾細眉前後直醉來引客上紅樓面前一道桐溪流登臨山色在掌內指點霞光隨杖頭東郭野人慵櫛沐使將破履升華屋數杯酩酊不得歸樓中便蓋江雲宿卻被江雲濕我衣賴君借我貂襜歸夏日過從叔幽居且將一葉繫垂楊門對清溪夏日長林下喜逢青竹巷局邊輸卻紫羅囊碧蹄駿馬銜芻細紅粉佳人挈榼香伯仲歷官年盡少那知不笑漢馮唐贈族叔處士我家名士已無求若見翔鴻便舉頭紫石巖邊吟繡段青苔紙上落銀鈎髙人酒席稱無醉細字經書讀未休定是仙山足靈藥年過八十轉風流遊安禪寺徐凝欲到安禪遊聖概先觀湧塔出香城樓臺有日連雲漢壑谷無年斷水聲倚竹並肩青玉立上橋如踏白虹行傷嗟置寺碑交碎不見梁朝施主名新定途中杜牧無端偶效張文紀下杜鄉園别五秋重過江南更千里萬山深處一孤舟睦州四韻州在釣臺邊溪山實可憐有家皆掩映無處不潺湲好樹鳴幽鳥晴樓入野煙殘春杜陵客中酒落花前題新定八松院小石雨滴珠璣碎苔生紫翠重故關何日到且看小三峯寄內兄和州崔員外十二韻歷陽崔太守何日不含情恩義同鍾李塤篪實弟兄光塵能混合擘畫最分明臺閣仁賢譽閨門孝友聲西方像教毁南海繡衣行金橐寧回顧珠簞肯一棖祇宜裁密詔何自取專城進退無非道回翔必有名好風初婉軟離思苦縈盈金馬舊遊貴桐廬春水生雨侵寒牖夢梅引凍醪傾共祝中興主髙歌倡太平丹水何事苦縈回離腸不自裁恨聲隨夢去春態逐雲來沈定藍光徹喧盤粉浪開翠巖三百尺誰作子陵臺郡中有懷寄上睦州員外十三兄歙州刺史邢羣城枕溪流淺更斜麗譙連帶邑人家經冬野菜青青色未臘山梅樹樹花雖免瘴雲生嶺上永無京信到天涯如今嵗晏從羈滯心喜彈冠事不賒正初奉酬翠巖千尺倚溪斜曽得嚴光作釣家越嶂逺分丁字水臘梅遲見二年花明時刀尺君須用幽處田園我有涯一壑風煙陽羡里解龜休去路非賒秋晚蚤發新定解印書千軸重陽酒百缸涼風滿紅樹曉月下秋江巖壑會歸去塵埃終不降懸纓未敢濯嚴瀨碧淙淙除官歸京睦州雨霽秋半吳天霽清凝萬里光水聲侵笑語嵐翠撲衣裳逺樹凝羅帳孤雲認粉囊溪山侵兩越時節到重陽顧我能甘賤無由得自強誤曽公觸尾不敢夜循牆豈意籠飛鳥還歸錦帳郎網今開傅燮書舊識黃香姹女真虛語飢兒欲一行淺深須揭厲休更學張綱夜泊桐廬先寄蘇臺盧郎中水檻桐廬館歸舟繫石根笛吹孤戍月犬吠隔溪村十載違清義幽懷未一論蘇臺菊花節何處與開尊嚴陵釣臺下作權德輿絶頂聳蒼翠清湍石磷磷先生晦其中天子不得臣心靈棲皓元纓冕猶緇塵不樂禁中卧卻歸江上春潛驅東漢風日使薄者醇焉用佐天下持此報故人則知大賢心不獨私其身弛張有深致耕釣陶天真奈何清風後擾擾論屈伸交情同市道利欲相紛綸我行訪遺臺仰古懷逸民矰繳鴻鵠逺雪霜松桂新江沈去不窮山色陵秋旻人世自今古清輝煦無垠宿桐廬館同崔存度醉後作白居易江海漂漂共旅遊一尊相勸散窮愁夜深醒後愁還在雨滴梧桐山館秋憑李睦州訪徐凝山人凝即睦州之民也郡守輕詩客鄉人薄釣翁解憐徐處士唯有李郎中嚴陵集卷一
